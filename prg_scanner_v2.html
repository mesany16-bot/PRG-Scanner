<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRG Scanner</title>
  <style>
    body { font-family: Arial; padding: 15px; text-align: center; background: #f9f9f9; }
    h2 { margin-bottom: 10px; }
    #viewfinder-wrap {
      position: relative; width: 300px; margin: auto;
      border: 3px solid #333; border-radius: 8px; overflow: hidden;
      background: #000;
    }
    video { width: 100%; display: block; }
    #overlay {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 200px; height: 200px;
      border: 3px solid #00ff88;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
      pointer-events: none;
    }
    #status {
      margin: 10px 0; font-size: 15px; color: #333;
      min-height: 22px; font-weight: bold;
    }
    .btn-row { margin: 8px 0; }
    button {
      padding: 11px 16px; margin: 4px; font-size: 15px;
      cursor: pointer; border: none; border-radius: 6px;
      background: #4a90e2; color: #fff;
    }
    button:active { opacity: 0.7; }
    button.red { background: #e24a4a; }
    button.green { background: #27ae60; }
    button.gray { background: #888; }
    table { margin-top: 15px; width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { border: 1px solid #ccc; padding: 9px; }
    th { background: #e8e8e8; }
    tr.new { background: #d4ffd4; }
    #unsupported { display:none; color: red; margin-top: 10px; }
  </style>
</head>
<body>

<h2>📦 PRG Scanner</h2>

<div id="viewfinder-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="overlay"></div>
</div>

<div id="status">Stiskni ▶ Start</div>
<div id="unsupported">
  ⚠️ Tento prohlížeč nepodporuje BarcodeDetector.<br>
  Použij Chrome nebo Edge na Androidu / Windows.
</div>

<div class="btn-row">
  <button onclick="startScan()">▶ Start</button>
  <button onclick="stopScan()" class="red">⏹ Stop</button>
  <button onclick="exportCSV()" class="green">📥 Export CSV</button>
  <button onclick="resetData()" class="gray">♻ Reset</button>
</div>

<table>
  <thead>
    <tr><th>Barcode</th><th>Kusy</th></tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  let data = {};
  let stream = null;
  let detector = null;
  let scanLoop = null;
  let lastCode = "";
  let lastTime = 0;
  const DEBOUNCE_MS = 2000;

  const video = document.getElementById("video");

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  async function startScan() {
    // Zkontroluj podporu BarcodeDetector
    if (!("BarcodeDetector" in window)) {
      document.getElementById("unsupported").style.display = "block";
      setStatus("❌ BarcodeDetector není podporován");
      return;
    }

    // Vytvoř detektor – podporované formáty
    try {
      const supported = await BarcodeDetector.getSupportedFormats();
      detector = new BarcodeDetector({ formats: supported });
    } catch(e) {
      detector = new BarcodeDetector({
        formats: ["qr_code","ean_13","ean_8","code_128","code_39","upc_a","upc_e","data_matrix","pdf417","itf","aztec"]
      });
    }

    // Spusť kameru
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
      });
      video.srcObject = stream;
      await video.play();
      setStatus("📷 Skenuje se…");
      scanLoop = requestAnimationFrame(scan);
    } catch(err) {
      setStatus("❌ Kamera: " + err.message);
    }
  }

  async function scan() {
    if (!detector || !stream) return;
    try {
      const barcodes = await detector.detect(video);
      if (barcodes.length > 0) {
        const code = barcodes[0].rawValue;
        const now = Date.now();
        if (code !== lastCode || now - lastTime > DEBOUNCE_MS) {
          lastCode = code;
          lastTime = now;
          addItem(code);
        }
      }
    } catch(e) { /* snímek nebyl připraven */ }
    scanLoop = requestAnimationFrame(scan);
  }

  function stopScan() {
    if (scanLoop) { cancelAnimationFrame(scanLoop); scanLoop = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    detector = null;
    setStatus("⏹ Zastaveno");
  }

  function addItem(code) {
    data[code] = (data[code] || 0) + 1;
    setStatus("✅ " + code + " → celkem: " + data[code] + " ks");
    renderTable(code);
  }

  function renderTable(highlightCode) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    for (let code in data) {
      const tr = document.createElement("tr");
      if (code === highlightCode) tr.className = "new";
      tr.innerHTML = `<td>${code}</td><td>${data[code]}</td>`;
      tbody.appendChild(tr);
    }
  }

  function exportCSV() {
    if (!Object.keys(data).length) { setStatus("⚠️ Žádná data"); return; }
    let csv = "Barcode,Kusy\n";
    for (let code in data) csv += `"${code}",${data[code]}\n`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    a.download = "prg_scan.csv";
    a.click();
    setStatus("📥 CSV exportováno");
  }

  function resetData() {
    data = {};
    lastCode = "";
    document.getElementById("tableBody").innerHTML = "";
    setStatus("♻ Data smazána");
  }
</script>
</body>
</html>
