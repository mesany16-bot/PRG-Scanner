<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRG Scanner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Barlow+Condensed:wght@400;600;700&display=swap');

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #00e5a0;
      --accent2: #e05a00;
      --danger: #e04a4a;
      --text: #e8eaf0;
      --muted: #6b7080;
      --scan-btn: #00e5a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow Condensed', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    #user-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    #user-input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 5px 8px;
      border-radius: 5px;
      width: 110px;
    }

    #user-input:focus { outline: none; border-color: var(--accent); }

    /* Camera */
    #cam-wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto 10px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #000;
      aspect-ratio: 4/3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #aim {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 55%; height: 40%;
      border: 2px solid var(--accent);
      border-radius: 4px;
      pointer-events: none;
    }

    #aim::before, #aim::after,
    #aim .c2, #aim .c3 {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-color: var(--accent);
      border-style: solid;
    }
    #aim::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
    #aim::after  { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
    #aim .c2     { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
    #aim .c3     { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

    #cam-status {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.65);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      padding: 5px 10px;
      text-align: center;
    }

    /* Flash overlay */
    #flash {
      position: absolute; inset: 0;
      background: var(--accent);
      opacity: 0;
      pointer-events: none;
      border-radius: 8px;
      transition: opacity 0.05s;
    }

    /* SCAN button */
    #scan-btn {
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 0 auto 12px;
      padding: 18px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: var(--scan-btn);
      color: #0f1117;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
      box-shadow: 0 4px 20px rgba(0,229,160,0.3);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #scan-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(0,229,160,0.2);
    }

    #scan-btn:disabled {
      background: var(--border);
      color: var(--muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Control buttons */
    .ctrl-row {
      display: flex;
      gap: 8px;
      max-width: 360px;
      margin: 0 auto 14px;
    }

    .ctrl-row button {
      flex: 1;
      padding: 10px 6px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }

    .ctrl-row button:hover { border-color: var(--accent); color: var(--accent); }
    .ctrl-row button.start { border-color: #2a8a5e; color: #00e5a0; }
    .ctrl-row button.stop  { border-color: #7a2a2a; color: var(--danger); }
    .ctrl-row button.exp   { border-color: #5a6a2a; color: #c8e000; }
    .ctrl-row button.rst   { border-color: #4a3a2a; color: var(--accent2); }

    /* Status bar */
    #status {
      max-width: 360px;
      margin: 0 auto 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      min-height: 36px;
      word-break: break-all;
    }

    /* Table */
    #table-wrap {
      max-width: 360px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead { background: var(--surface); }
    th {
      padding: 9px 8px;
      text-align: left;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.2s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr.highlight { background: rgba(0,229,160,0.1); }

    td {
      padding: 8px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      vertical-align: middle;
    }

    td.code { color: var(--text); word-break: break-all; font-size: 12px; }
    td.qty  { color: var(--accent); font-weight: 700; text-align: center; width: 40px; }
    td.acts { text-align: right; white-space: nowrap; width: 70px; }

    .qty-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 26px; height: 26px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      line-height: 1;
      transition: border-color 0.15s;
    }
    .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
    .qty-btn.minus:hover { border-color: var(--danger); color: var(--danger); }

    #unsupported {
      display: none;
      max-width: 360px;
      margin: 10px auto;
      background: #2a1010;
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 7px;
      padding: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>📦 PRG Scanner</h1>
  <div id="user-wrap">
    <span>👤</span>
    <input id="user-input" type="text" placeholder="Jméno" maxlength="30">
  </div>
</header>

<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="aim"><span class="c2"></span><span class="c3"></span></div>
  <div id="flash"></div>
  <div id="cam-status">Kamera vypnuta</div>
</div>

<button id="scan-btn" disabled onclick="triggerScan()">⬛ SKENOVAT</button>

<div class="ctrl-row">
  <button class="start" onclick="startCam()">▶ Start</button>
  <button class="stop"  onclick="stopCam()">⏹ Stop</button>
  <button class="exp"   onclick="exportCSV()">📥 CSV</button>
  <button class="rst"   onclick="resetData()">♻ Reset</button>
</div>

<div id="status">Čekám na spuštění kamery…</div>
<div id="unsupported">⚠️ BarcodeDetector není podporován. Použij Chrome/Edge na Androidu.</div>

<div id="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Barcode</th>
        <th style="text-align:center">Ks</th>
        <th style="text-align:right">Úprava</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  // ── Audio beep (Web Audio API) ─────────────────────────
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function beep() {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(1480, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.12);
    } catch(e) {}
  }

  // ── State ───────────────────────────────────────────────
  // data[code] = { qty, user, timestamps:[] }
  let data = {};
  let stream = null;
  let detector = null;
  let cameraReady = false;

  const video    = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const scanBtn  = document.getElementById('scan-btn');
  const camStatus= document.getElementById('cam-status');

  function setStatus(msg) { statusEl.textContent = msg; }
  function setCamStatus(msg) { camStatus.textContent = msg; }

  // ── Camera ─────────────────────────────────────────────
  async function startCam() {
    if (!('BarcodeDetector' in window)) {
      document.getElementById('unsupported').style.display = 'block';
      setStatus('❌ BarcodeDetector není podporován');
      return;
    }
    try {
      const supported = await BarcodeDetector.getSupportedFormats();
      detector = new BarcodeDetector({ formats: supported });
    } catch(e) {
      detector = new BarcodeDetector({ formats: [
        'qr_code','ean_13','ean_8','code_128','code_39','upc_a','upc_e','data_matrix','pdf417','itf','aztec'
      ]});
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }
      });
      video.srcObject = stream;
      await video.play();
      cameraReady = true;
      scanBtn.disabled = false;
      scanBtn.textContent = '📷 SKENOVAT';
      setCamStatus('📷 Kamera připravena – stiskni tlačítko');
      setStatus('✅ Kamera spuštěna. Namiř a stiskni SKENOVAT.');
    } catch(err) {
      setStatus('❌ Kamera: ' + err.message);
    }
  }

  function stopCam() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    cameraReady = false;
    detector = null;
    scanBtn.disabled = true;
    scanBtn.textContent = '⬛ SKENOVAT';
    setCamStatus('Kamera vypnuta');
    setStatus('⏹ Zastaveno.');
  }

  // ── Scan on button press ────────────────────────────────
  async function triggerScan() {
    if (!detector || !cameraReady) return;
    setCamStatus('🔍 Detekuji…');
    try {
      const barcodes = await detector.detect(video);
      if (barcodes.length === 0) {
        setCamStatus('⚠️ Nic nenalezeno – zkus znovu');
        setStatus('⚠️ Žádný kód nebyl detekován. Namiř lépe a zkus znovu.');
        return;
      }
      const code = barcodes[0].rawValue;
      flashScreen();
      beep();
      addItem(code);
      setCamStatus('📷 Kamera připravena – stiskni tlačítko');
    } catch(e) {
      setStatus('❌ Chyba detekce: ' + e.message);
    }
  }

  function flashScreen() {
    const f = document.getElementById('flash');
    f.style.opacity = '0.5';
    setTimeout(() => { f.style.opacity = '0'; }, 120);
  }

  // ── Data ────────────────────────────────────────────────
  function getUser() {
    return document.getElementById('user-input').value.trim() || 'neznámý';
  }

  function now() {
    return new Date().toLocaleString('cs-CZ', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit', second:'2-digit'
    });
  }

  function addItem(code) {
    const user = getUser();
    const ts = now();
    if (data[code]) {
      data[code].qty++;
      data[code].timestamps.push(ts);
    } else {
      data[code] = { qty: 1, user, timestamps: [ts] };
    }
    setStatus(`✅ ${code}  →  ${data[code].qty} ks  [${user}]`);
    renderTable(code);
  }

  function changeQty(code, delta) {
    if (!data[code]) return;
    data[code].qty += delta;
    if (delta > 0) data[code].timestamps.push(now());
    if (data[code].qty <= 0) {
      delete data[code];
      setStatus(`🗑 ${code} odstraněno`);
    } else {
      setStatus(`✏️ ${code}  →  ${data[code].qty} ks`);
    }
    renderTable();
  }

  function renderTable(highlightCode) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    const codes = Object.keys(data);
    if (codes.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="color:var(--muted);text-align:center;padding:16px;font-family:'JetBrains Mono',monospace;font-size:12px;">Žádná data</td></tr>`;
      return;
    }
    codes.forEach(code => {
      const tr = document.createElement('tr');
      if (code === highlightCode) {
        tr.className = 'highlight';
        setTimeout(() => tr.classList.remove('highlight'), 800);
      }
      tr.innerHTML = `
        <td class="code">${code}</td>
        <td class="qty">${data[code].qty}</td>
        <td class="acts">
          <button class="qty-btn" onclick="changeQty('${code}', 1)" title="Přidat">+</button>
          <button class="qty-btn minus" onclick="changeQty('${code}', -1)" title="Odebrat">−</button>
        </td>`;
      tbody.appendChild(tr);
    });
  }

  // ── Export ──────────────────────────────────────────────
  function exportCSV() {
    if (!Object.keys(data).length) { setStatus('⚠️ Žádná data k exportu'); return; }
    let csv = 'Barcode,Kusy,Uzivatel,Posledni_scan\n';
    for (let code in data) {
      const d = data[code];
      const lastTs = d.timestamps[d.timestamps.length - 1] || '';
      csv += `"${code}",${d.qty},"${d.user}","${lastTs}"\n`;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = `prg_scan_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    setStatus('📥 CSV exportováno');
  }

  function resetData() {
    if (!confirm('Opravdu smazat všechna data?')) return;
    data = {};
    renderTable();
    setStatus('♻ Data smazána');
  }

  // Init
  renderTable();
</script>
</body>
</html>
